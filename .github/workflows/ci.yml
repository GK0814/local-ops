name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-release:
    name: Check and release audit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_DATE_EPOCH: "1704067200"

    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Show toolchain
        run: |
          python --version
          node --version

      - name: Run project checks
        run: python tools/check_project.py --skip-tests

      - name: Run macOS behavior tests
        if: runner.os == 'macOS'
        run: python tools/check_project.py

      - name: Run Windows behavior tests
        if: runner.os == 'Windows'
        run: python tools/check_project.py

      - name: Build and verify release
        shell: pwsh
        run: |
          python tools/build_release.py
          python tools/build_release.py --verify-only
          $archive = Get-ChildItem dist/console-*.zip | Select-Object -First 1
          Copy-Item $archive "$env:RUNNER_TEMP/console-first.zip"
          python tools/build_release.py
          $second = Get-ChildItem dist/console-*.zip | Select-Object -First 1
          if ((Get-FileHash $second -Algorithm SHA256).Hash -ne (Get-FileHash "$env:RUNNER_TEMP/console-first.zip" -Algorithm SHA256).Hash) { throw 'Release archive is not reproducible' }
          python tools/build_release.py --verify-only
